# Render.com Blueprint — Single Service (API + Web)
services:
  - type: web
    name: nusuk-platform-evc
    runtime: node
    region: frankfurt
    plan: starter
    repo: https://github.com/Noujoomm/nusuk-platform.git
    branch: main
    autoDeploy: true
    buildCommand: npm install && cd apps/api && npx prisma generate && npm run build && cd ../web && npm run build
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nusuk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: API_PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: nusuk-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16
